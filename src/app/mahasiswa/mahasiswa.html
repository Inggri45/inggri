<div class="wrapper">
  <app-header></app-header>
  <app-sidebar moduleName="mahasiswa"></app-sidebar>

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0 text-dark">Mahasiswa</h1>
          </div>

          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item">
                <a href="/dashboard">Home</a>
              </li>
              <li class="breadcrumb-item active">Mahasiswa</li>
            </ol>
          </div>
        </div>
      </div>
    </div>
    <!-- /.content-header -->

    <!-- Main content -->
    <section class="content">
      <div class="container-fluid">
        <!-- main row -->
        <div class="row">
          <button id="tambahButton" class="btn btn-primary mb-2" (click)="showTambahModal()">
            <i class="fa fa-plus"></i>
            Tambah
          </button>
        </div>

        <!-- Table Section -->
        <div class="row">
          <div class="col-12">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Data Mahasiswa</h3>
                <div class="card-tools">
                  <button type="button" class="btn btn-tool" id="refreshTable">
                    <i class="fas fa-sync-alt"></i>
                  </button>
                </div>
              </div>
              <div class="card-body">
                <div class="table-responsive">
                  <table id="table1" class="table table-hover table-bordered table-striped">
                    <thead>
                      <tr>
                        <th></th>
                        <th>NIM</th>
                        <th>Nama</th>
                        <th>Jenis Kelamin</th>
                        <th>Tempat, Tanggal Lahir</th>
                        <th>JP</th>
                        <th>Alamat</th>
                        <th>Status</th>
                        <th>Tahun Masuk</th>
                      </tr>
                    </thead>
                    <tbody>
                      <!-- Data akan diisi oleh DataTables -->
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->
  <app-footer></app-footer>
</div>

<div class="modal fade" id="tambahModal" tabindex="-1" role="dialog">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header bg-primary">
        <h5 class="modal-title">
          <i class="fa fa-plus"></i>
          Mahasiswa Baru
        </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="nimText">NIM</label>
          <input type="text" id="nimText" class="form-control" />
        </div>
        <div class="form-group">
          <label for="namaText">Nama</label>
          <input type="text" id="namaText" class="form-control" />
        </div>
        <div class="form-group">
          <label for="jenisKelaminSelect">Jenis Kelamin</label>
          <select id="jenisKelaminSelect" class="form-control">
            <option value="">Pilih Jenis Kelamin</option>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tempatLahirText">Tempat Lahir</label>
          <input type="text" id="tempatLahirText" class="form-control" />
        </div>
        <div class="form-group">
          <label for="tanggalLahirInput">Tanggal Lahir (yyyy-mm-dd)</label>
          <input type="date" id="tanggalLahirInput" class="form-control" />
        </div>
        <div class="form-group">
          <label for="jpSelect">Jurusan/Prodi</label>
          <select id="jpSelect" class="form-control">
            <option value="SI/SI">SI/SI</option>
            <option value="TI/TI">TI/TI</option>
          </select>
        </div>
        <div class="form-group">
          <label for="alamatText">Alamat</label>
          <input type="text" id="alamatText" class="form-control" />
        </div>
        <div class="form-group">
          <label for="statusNikahSelect">Status Pernikahan</label>
          <select id="statusNikahSelect" class="form-control">
            <option value="Belum Menikah">Belum Menikah</option>
            <option value="Menikah">Menikah</option>
            <option value="Duda">Duda</option>
            <option value="Janda">Janda</option>
          </select>
        </div>
        <div class="form-group">
          <label for="tahunMasukInput">Tahun Masuk</label>
          <input type="number" id="tahunMasukInput" class="form-control" />
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Batal</button>
        <button type="button" class="btn btn-primary" (click)="postRecord()">
          <i class="fa fa-save"></i>
          Simpan
        </button>
      </div>
    </div>
  </div>
</div>
