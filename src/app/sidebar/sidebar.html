 <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
      <!-- Brand Logo -->
    <a href="index3.html" class="brand-link">
      <img src="dist/img/Logo1.png" alt="AdminLTE Logo" class="brand-image img-circle elevation-3"
           style="opacity: .8">
      <span class="brand-text font-weight-light">Admin IT</span>
    </a>

    <!-- Sidebar -->
    <div class="sidebar">
      <!-- Sidebar user panel (optional) -->
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <img src="dist/img/inggri_1.jpeg" class="img-circle elevation-2" alt="User Image">
        </div>
        <div class="info">
          <a href="#" class="d-block">Inggri Eka Pratiwi</a>
        </div>
      </div>

      <!-- Sidebar Menu -->
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <!-- Add icons to the links using the .nav-icon class
               with font-awesome or any other icon font library -->
          <li class="nav-item has-treeview {{ (moduleName == 'dashboard1' || moduleName == 'dashboard2' || moduleName == 'dashboard3') && 'menu-open' }}">
            <a href="#" (click)="$event.preventDefault()" class="nav-link {{ (moduleName == 'dashboard1' || moduleName == 'dashboard2' || moduleName == 'dashboard3') && 'active' }}">
              <i class="nav-icon fas fa-tachometer-alt"></i>
              <p>
                Dashboard
                <i class="right fas fa-angle-left"></i>
              </p>
            </a>
            <ul class="nav nav-treeview">
              <li class="nav-item">
                <a [routerLink]="['/dashboard1']" routerLinkActive="active" class="nav-link {{ (moduleName == 'dashboard1') && 'active' }}">
                  <i class="far fa-circle nav-icon"></i>
                  <p>Dashboard v1</p>
                </a>
              </li>
              <li class="nav-item">
                <a [routerLink]="['/dashboard2']" routerLinkActive="active" class="nav-link">
                  <i class="far fa-circle nav-icon"></i>
                  <p>Dashboard v2</p>
                </a>
              </li>
              <li class="nav-item">
                <a [routerLink]="['/dashboard3']" routerLinkActive="active" class="nav-link">
                  <i class="far fa-circle nav-icon"></i>
                  <p>Dashboard v3</p>
                </a>
              </li>
            </ul>
          </li>

          <!-- Menambahkan Menu Mahasiswa-->
          <li class="nav-item">
            <a [routerLink]="['/mahasiswa']" routerLinkActive="router-link-active" class="nav-link {{ moduleName == 'mahasiswa' ? 'active' : '' }} ">

              <i class="nav-icon fas fa-graduation-cap"></i>
              <p>
                Mahasiswa
              </p>
            </a>
          </li>

          <!-- Menambahkan Menu Forex -->
          <li class="nav-item">
            <a [routerLink]="['/forex']" class="nav-link {{ (moduleName == 'forex') ? 'active' : ''}}">
              <i class="nav-icon fas fa-money-bill-alt"></i>
              <p>
                Forex
              </p>
            </a>
          </li>

          <!-- Menambahkan Menu Cuaca -->
          <li class="nav-item">
            <a [routerLink]="['/cuaca']" routerLinkActive="active" class="nav-link {{ (moduleName == 'cuaca') ? 'active' : ''}}">
              <i class="nav-icon fas fa-cloud-rain"></i>
              <p>
                Cuaca
              </p>
            </a>
          </li>

        <!-- Menambahkan Menu Light/Dark Mode -->
          <li class="nav-item">
            <a href="" class="nav-link" (click)="toggleTheme(); $event.preventDefault()">
              <i class="nav-icon fas fa-adjust"></i>
              <p>
                Light/Dark Mode
              </p>
            </a>
          </li>

          <!-- Menu Saham -->
          <li class="nav-item">
            <a [routerLink]="['/saham']"
              class="nav-link {{ (moduleName == 'saham') ? 'active' : ''}}">
              <i class="nav-icon fas fa-chart-line"></i>
              <p>
                Saham
              </p>
            </a>
          </li>

          <!-- Menu Crypto -->
          <li class="nav-item">
            <a [routerLink]="['/crypto']"
              class="nav-link {{ (moduleName == 'crypto') ? 'active' : ''}}">
              <i class="nav-icon fab fa-bitcoin"></i>
              <p>
                Crypto
              </p>
            </a>
          </li>

          <!-- Menambahkan Menu Nasa -->
          <li class="nav-item">
            <a [routerLink]="['/nasa']" routerLinkActive="active" class="nav-link {{ (moduleName == 'nasa') ? 'active' : ''}}">
              <i class="nav-icon fas fa-rocket"></i>
              <p>
                Nasa
              </p>
            </a>
          </li>

          <!-- Menambahkan Menu Gallery -->
          <li class="nav-item">
            <a [routerLink]="['/gallery']" routerLinkActive="active" class="nav-link {{ (moduleName == 'gallery') ? 'active' : ''}}">
              <i class="nav-icon far fa-image"></i>
              <p>
                Gallery
              </p>
            </a>
          </li>

          <!-- Menambahkan Menu Logout -->
          <li class="nav-item">
            <a href="#" class="nav-link" (click)="confirmLogout($event)">
              <i class="far fa-circle nav-icon"></i>
              <p>Logout</p>
            </a>
          </li>
        </ul>
      </nav>
      <!-- /.sidebar-menu -->
    </div>
    <!-- /.sidebar -->
  </aside>
